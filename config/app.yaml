exchange:
  name: bitso
  quote_currency: USD
  trading_mode: spot

pairs:
  mode: all_eligible
  min_history_days: 14
  require_active: true
  require_spot: true
  evaluate_ticker_liquidity: false
  manual_exclusions: config/pairs.yaml

strategies:
  registry: config/strategies.yaml
  upstream_path: third_party/NostalgiaForInfinity

data:
  source: alpaca
  proxy_market_data: true
  requested_history_start: "2020-01-01"
  # Alpaca Crypto US starts on 2021-01-01; 800 daily startup candles make this
  # the first common signal date that preserves NFI's unmodified warm-up.
  history_start: "2023-03-12"
  pairs: [BTC/USD, DOGE/USD, SOL/USD]
  timeframes: [5m, 15m, 1h, 4h, 1d]
  cache_dir: user_data/data/alpaca

backtest:
  timerange: maximum
  update_data: true
  max_parallel: auto
  stake_amount: unlimited
  max_open_trades: 8
  export_trades: true

acceleration:
  mode: auto
  min_gpu_elements: 1000000
  numeric_rtol: 1.0e-10
  numeric_atol: 1.0e-12

report:
  consolidated_html: true
  output: reports/latest/report.html

telegram:
  enabled: false

trading:
  dry_run: true
  live_enabled: false
  require_environment_gate: true
